  <text
    x="16"
    y="23"
    font-family="Geist, 'Geist Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="700"
    text-anchor="middle"
    fill="#C2410C"
    letter-spacing="-0.04em"
  >S</text>
</svg>
